[project]
name = "kodama"
version = "1.0.0"
description = "記憶を保ちながらキャラクターと話すローカル会話CLI"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
claude = ["anthropic>=1.0"]

[project.scripts]
kodama = "kodama.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kodama"]

[tool.pytest.ini_options]
testpaths = ["tests"]
